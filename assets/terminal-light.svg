<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" width="100%" height="390" role="img" aria-labelledby="term-title-lt term-desc-lt">
  <title id="term-title-lt">Sahan Ranasingha — macOS Terminal Card</title>
  <desc id="term-desc-lt">macOS style CLI terminal card showing profile info, role, tech stack, and engineering philosophy in JSON format.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="term-bg-lt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="header-bg-lt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="term-border-lt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#94A3B8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="card-shadow-lt" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>

    <style>
      .txt-base-lt { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13.5px; }
      .txt-prompt-lt { font-weight: 700; fill: #059669; }
      .txt-path-lt { font-weight: 700; fill: #0284C7; }
      .txt-cmd-lt { font-weight: 600; fill: #0F172A; }
      .txt-key-lt { font-weight: 600; fill: #0284C7; }
      .txt-val-lt { fill: #6D28D9; }
      .txt-val-special-lt { fill: #B45309; }
      .txt-val-green-lt { fill: #047857; }
      .txt-bracket-lt { fill: #64748B; font-weight: 600; }
      .caret-lt { animation: blink-lt 1.1s steps(2, start) infinite; fill: #0284C7; }
      .btn-close-lt { fill: #FF5F56; }
      .btn-min-lt { fill: #FFBD2E; }
      .btn-max-lt { fill: #27C93F; }
      @keyframes blink-lt { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .caret-lt { animation: none; opacity: 1; } }
    </style>
  </defs>

  <!-- Window Container with Shadow & Border -->
  <g filter="url(#card-shadow-lt)">
    <!-- Terminal Background -->
    <rect x="10" y="10" width="840" height="370" rx="14" fill="url(#term-bg-lt)" stroke="url(#term-border-lt)" stroke-width="1.2" />

    <!-- macOS Title Bar -->
    <path d="M10 24 Q10 10 24 10 L836 10 Q850 10 850 24 L850 48 L10 48 Z" fill="url(#header-bg-lt)" />
    <line x1="10" y1="48" x2="850" y2="48" stroke="#E2E8F0" stroke-width="1" />

    <!-- Window Controls (Traffic Lights) -->
    <circle cx="34" cy="29" r="6" class="btn-close-lt" />
    <circle cx="54" cy="29" r="6" class="btn-min-lt" />
    <circle cx="74" cy="29" r="6" class="btn-max-lt" />

    <!-- Window Title -->
    <text x="430" y="33" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B" letter-spacing="0.3">
      sahan@dev
    </text>

    <!-- Terminal Content Area -->
    <g class="txt-base-lt" transform="translate(36, 76)">
      <!-- Line 1: Command Prompt -->
      <text y="0">
        <tspan class="txt-prompt-lt">➜ </tspan>
        <tspan class="txt-path-lt">~ </tspan>
        <tspan class="txt-cmd-lt">cat sahan.profile.json</tspan>
      </text>

      <!-- JSON Output -->
      <text y="24" class="txt-bracket-lt">{</text>
      
      <text y="46">
        <tspan x="18" class="txt-key-lt">"name":</tspan>
        <tspan class="txt-val-lt"> "Sahan Ranasingha",</tspan>
      </text>

      <text y="68">
        <tspan x="18" class="txt-key-lt">"role":</tspan>
        <tspan class="txt-val-lt"> "Associate Software Engineer",</tspan>
      </text>

      <text y="90">
        <tspan x="18" class="txt-key-lt">"workplace":</tspan>
        <tspan class="txt-val-lt"> "Artslab Creatives",</tspan>
      </text>

      <text y="112">
        <tspan x="18" class="txt-key-lt">"education":</tspan>
        <tspan class="txt-val-lt"> "B.Sc. in Computer Science &amp; Technology (SUSL)",</tspan>
      </text>

      <text y="134">
        <tspan x="18" class="txt-key-lt">"builds":</tspan>
        <tspan class="txt-bracket-lt"> [</tspan><tspan class="txt-val-lt">"Web Apps"</tspan><tspan class="txt-bracket-lt">, </tspan><tspan class="txt-val-lt">"REST APIs"</tspan><tspan class="txt-bracket-lt">, </tspan><tspan class="txt-val-lt">"Software Solutions"</tspan><tspan class="txt-bracket-lt">],</tspan>
      </text>

      <text y="156">
        <tspan x="18" class="txt-key-lt">"exploring":</tspan>
        <tspan class="txt-bracket-lt"> [</tspan><tspan class="txt-val-lt">"Cloud"</tspan><tspan class="txt-bracket-lt">, </tspan><tspan class="txt-val-lt">"DevOps"</tspan><tspan class="txt-bracket-lt">, </tspan><tspan class="txt-val-lt">"CI/CD"</tspan><tspan class="txt-bracket-lt">, </tspan><tspan class="txt-val-lt">"Automation"</tspan><tspan class="txt-bracket-lt">],</tspan>
      </text>

      <text y="178">
        <tspan x="18" class="txt-key-lt">"philosophy":</tspan>
        <tspan class="txt-val-special-lt"> "Build → Learn → Iterate → Ship",</tspan>
      </text>

      <text y="200">
        <tspan x="18" class="txt-key-lt">"status":</tspan>
        <tspan class="txt-val-green-lt"> "Always improving &amp; building cool things 🚀"</tspan>
      </text>

      <text y="222" class="txt-bracket-lt">}</text>

      <!-- Line 2: Active Prompt with Caret -->
      <text y="254">
        <tspan class="txt-prompt-lt">➜ </tspan>
        <tspan class="txt-path-lt">~ </tspan>
        <tspan class="txt-cmd-lt">git push origin future</tspan>
      </text>
      <rect x="230" y="241" width="8.5" height="16" rx="1.5" class="caret-lt" />
    </g>
  </g>
</svg>
