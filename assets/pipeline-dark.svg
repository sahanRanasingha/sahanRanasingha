    <rect x="729" y="52" width="205" height="108" rx="17" fill="#0C162A" stroke="#2B3A56"/>
    <rect x="743" y="66" width="40" height="27" rx="8" fill="#12223A" stroke="#58E8F2" stroke-opacity=".4"/>
    <text x="763" y="85" font-family="DejaVu Sans Mono,monospace" font-size="13" text-anchor="middle" fill="#58E8F2">04</text>
    <text x="745" y="118" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#F2F6FF">SHIP</text>
    <text x="745" y="142" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#A3B2CD">CI / CD automation</text>
  </g>

  <!-- Stage 05: SCALE -->
  <g>
    <rect x="960" y="52" width="205" height="108" rx="17" fill="#0C162A" stroke="#2B3A56"/>
    <rect x="974" y="66" width="40" height="27" rx="8" fill="#12223A" stroke="#58E8F2" stroke-opacity=".4"/>
    <text x="994" y="85" font-family="DejaVu Sans Mono,monospace" font-size="13" text-anchor="middle" fill="#58E8F2">05</text>
