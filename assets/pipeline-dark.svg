<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="211" viewBox="0 0 1200 211" role="img" aria-labelledby="t">
  <title id="t">Plan to scale — current learning direction</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070C18"/>
      <stop offset="1" stop-color="#101B31"/>
    </linearGradient>
    <style><![CDATA[
      .beam { stroke-dasharray: 7 12; animation: beam 5s linear infinite; }
      .pulse { animation: light 3s ease-in-out infinite; }
      @keyframes beam { to { stroke-dashoffset: -150; } }
      @keyframes light { 50% { opacity: .25; } }
      @media (prefers-reduced-motion: reduce) { .beam, .pulse { animation: none; } }
    ]]></style>
  </defs>

  <rect width="1200" height="211" rx="20" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="209" rx="19" stroke="#2B3A56" fill="none"/>

  <text x="36" y="31" font-family="DejaVu Sans Mono,monospace" font-size="13" letter-spacing="2" fill="#A3B2CD">CURRENTLY EXPLORING // DEVELOPMENT TO DEPLOYMENT</text>

  <!-- Connecting Beam Lines -->
  <path d="M120 106H1080" stroke="#58E8F2" stroke-width="2" opacity=".25"/>
  <path class="beam" d="M120 106H1080" stroke="#58E8F2" stroke-width="2.5" opacity=".65"/>

  <!-- Stage 01: PLAN -->
  <g>
    <rect x="36" y="52" width="205" height="108" rx="17" fill="#0C162A" stroke="#2B3A56"/>
    <rect x="50" y="66" width="40" height="27" rx="8" fill="#12223A" stroke="#58E8F2" stroke-opacity=".4"/>
    <text x="70" y="85" font-family="DejaVu Sans Mono,monospace" font-size="13" text-anchor="middle" fill="#58E8F2">01</text>
    <text x="52" y="118" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#F2F6FF">PLAN</text>
    <text x="52" y="142" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#A3B2CD">Architecture &amp; design</text>
  </g>

  <!-- Stage 02: CODE -->
  <g>
    <rect x="267" y="52" width="205" height="108" rx="17" fill="#0C162A" stroke="#2B3A56"/>
    <rect x="281" y="66" width="40" height="27" rx="8" fill="#12223A" stroke="#58E8F2" stroke-opacity=".4"/>
    <text x="301" y="85" font-family="DejaVu Sans Mono,monospace" font-size="13" text-anchor="middle" fill="#58E8F2">02</text>
    <text x="283" y="118" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#F2F6FF">CODE</text>
    <text x="283" y="142" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#A3B2CD">Product engineering</text>
