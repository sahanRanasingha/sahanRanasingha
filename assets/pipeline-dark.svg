    <rect x="512" y="66" width="40" height="27" rx="8" fill="#12223A" stroke="#58E8F2" stroke-opacity=".4"/>
    <text x="532" y="85" font-family="DejaVu Sans Mono,monospace" font-size="13" text-anchor="middle" fill="#58E8F2">03</text>
    <text x="514" y="118" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#F2F6FF">BUILD</text>
    <text x="514" y="142" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#A3B2CD">Reliable workflows</text>
  </g>

