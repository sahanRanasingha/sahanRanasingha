<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" width="100%" height="390" role="img" aria-labelledby="term-title term-desc">
  <title id="term-title">Sahan Ranasingha — macOS Terminal Card</title>
  <desc id="term-desc">macOS style CLI terminal card showing profile info, role, tech stack, and engineering philosophy in JSON format.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C16" />
      <stop offset="100%" stop-color="#0E172A" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="header-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152136" />
      <stop offset="100%" stop-color="#0F1827" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.35" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.1" />
    </filter>

    <style>
      .txt-base { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13.5px; }
      .txt-prompt { font-weight: 700; fill: #51D9A4; }
      .txt-path { font-weight: 700; fill: #58E8F2; }
      .txt-cmd { font-weight: 600; fill: #F1F5F9; }
      .txt-key { font-weight: 600; fill: #38BDF8; }
      .txt-val { fill: #C4B5FD; }
      .txt-val-special { fill: #FDE047; }
      .txt-val-green { fill: #34D399; }
      .txt-bracket { fill: #94A3B8; font-weight: 600; }
      .caret { animation: blink 1.1s steps(2, start) infinite; fill: #58E8F2; }
      .btn-close { fill: #FF5F56; }
      .btn-min { fill: #FFBD2E; }
      .btn-max { fill: #27C93F; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .caret { animation: none; opacity: 1; } }
    </style>
  </defs>

  <!-- Window Container with Shadow & Border -->
  <g filter="url(#card-shadow)">
    <!-- Terminal Background -->
    <rect x="10" y="10" width="840" height="370" rx="14" fill="url(#term-bg)" stroke="url(#term-border)" stroke-width="1.2" />

    <!-- macOS Title Bar -->
    <path d="M10 24 Q10 10 24 10 L836 10 Q850 10 850 24 L850 48 L10 48 Z" fill="url(#header-bg)" />
    <line x1="10" y1="48" x2="850" y2="48" stroke="#1E293B" stroke-width="1" />

    <!-- Window Controls (Traffic Lights) -->
    <circle cx="34" cy="29" r="6" class="btn-close" />
    <circle cx="54" cy="29" r="6" class="btn-min" />
    <circle cx="74" cy="29" r="6" class="btn-max" />

    <!-- Window Title -->
    <text x="430" y="33" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" letter-spacing="0.3">
      sahan@dev
    </text>

    <!-- Terminal Content Area -->
    <g class="txt-base" transform="translate(36, 76)">
      <!-- Line 1: Command Prompt -->
      <text y="0">
        <tspan class="txt-prompt">➜ </tspan>
        <tspan class="txt-path">~ </tspan>
        <tspan class="txt-cmd">cat sahan.profile.json</tspan>
      </text>

      <!-- JSON Output -->
      <text y="24" class="txt-bracket">{</text>
      
      <text y="46">
        <tspan x="18" class="txt-key">"name":</tspan>
        <tspan class="txt-val"> "Sahan Ranasingha",</tspan>
      </text>

      <text y="68">
        <tspan x="18" class="txt-key">"role":</tspan>
        <tspan class="txt-val"> "Associate Software Engineer",</tspan>
      </text>

      <text y="90">
        <tspan x="18" class="txt-key">"workplace":</tspan>
        <tspan class="txt-val"> "Artslab Creatives",</tspan>
      </text>

      <text y="112">
        <tspan x="18" class="txt-key">"education":</tspan>
        <tspan class="txt-val"> "B.Sc. in Computer Science &amp; Technology (SUSL)",</tspan>
      </text>

      <text y="134">
        <tspan x="18" class="txt-key">"builds":</tspan>
        <tspan class="txt-bracket"> [</tspan><tspan class="txt-val">"Web Apps"</tspan><tspan class="txt-bracket">, </tspan><tspan class="txt-val">"REST APIs"</tspan><tspan class="txt-bracket">, </tspan><tspan class="txt-val">"Software Solutions"</tspan><tspan class="txt-bracket">],</tspan>
      </text>

      <text y="156">
        <tspan x="18" class="txt-key">"exploring":</tspan>
        <tspan class="txt-bracket"> [</tspan><tspan class="txt-val">"Cloud"</tspan><tspan class="txt-bracket">, </tspan><tspan class="txt-val">"DevOps"</tspan><tspan class="txt-bracket">, </tspan><tspan class="txt-val">"CI/CD"</tspan><tspan class="txt-bracket">, </tspan><tspan class="txt-val">"Automation"</tspan><tspan class="txt-bracket">],</tspan>
      </text>

      <text y="178">
        <tspan x="18" class="txt-key">"philosophy":</tspan>
        <tspan class="txt-val-special"> "Build → Learn → Iterate → Ship",</tspan>
      </text>

      <text y="200">
        <tspan x="18" class="txt-key">"status":</tspan>
        <tspan class="txt-val-green"> "Always improving &amp; building cool things 🚀"</tspan>
      </text>

      <text y="222" class="txt-bracket">}</text>

      <!-- Line 2: Active Prompt with Caret -->
      <text y="254">
        <tspan class="txt-prompt">➜ </tspan>
        <tspan class="txt-path">~ </tspan>
        <tspan class="txt-cmd">git push origin future</tspan>
      </text>
      <rect x="230" y="241" width="8.5" height="16" rx="1.5" class="caret" />
    </g>
  </g>
</svg>
